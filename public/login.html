<style>
  :root{
    --bg:#10131a;
    --surface:#181c23;
    --surface-2:#1f242c;
    --border:#2b313a;
    --text:#eceff2;
    --text-muted:#8c95a2;
    --accent:#e8a33d;
    --danger:#ef5b5b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:'Archivo',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(232,163,61,.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(232,163,61,.05), transparent 40%);
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  .card{
    width:100%;max-width:380px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:36px 32px 32px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }

  .logo-chip{
    background:#fff;border-radius:8px;padding:8px 16px;
    display:inline-flex;align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
    margin-bottom:22px;
  }
  .logo-chip img{height:40px;display:block;}

  h1{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em;}
  .sub{font-size:13.5px;color:var(--text-muted);margin:0 0 26px;}

  label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:6px;font-weight:600;}
  .field{margin-bottom:16px;}
  input[type=text], input[type=password]{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:11px 13px;border-radius:8px;font-family:inherit;font-size:14px;
    transition:border-color .15s ease;
  }
  input[type=text]:focus, input[type=password]:focus{
    outline:none;border-color:var(--accent);
  }

  .btn-entrar{
    width:100%;margin-top:8px;
    background:var(--accent);color:#1a1204;border:1px solid var(--accent);
    padding:12px 14px;border-radius:8px;font-size:14.5px;font-weight:700;
    font-family:inherit;cursor:pointer;
    transition:background .15s ease;
  }
  .btn-entrar:hover{background:#f0ae4d;}
  .btn-entrar:disabled{opacity:.6;cursor:default;}

  .erro{
    display:none;
    background:rgba(239,91,91,.12);border:1px solid rgba(239,91,91,.35);color:var(--danger);
    font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px;
  }

  .rodape{margin-top:22px;font-size:12px;color:#5c636c;text-align:center;}
</style>

    <h1>Controle de Coletas</h1>
    <p class="sub">Entre para gerenciar as coletas da frota.</p>

    <div class="erro" id="erro">Usuário ou senha incorretos.</div>

    <div class="field">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-entrar" id="btnEntrar">Entrar</button>

    <div class="rodape">CSRT Energia</div>
  </form>

<script>
const form = document.getElementById('loginForm');
const erro = document.getElementById('erro');
const btn = document.getElementById('btnEntrar');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  erro.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const usuario = document.getElementById('usuario').value;
  const senha = document.getElementById('senha').value;

  try{
    const res = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({usuario, senha})
    });
    if(res.ok){
      window.location.href = '/';
    }else{
      erro.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  }catch(e){
    erro.textContent = 'Não foi possível conectar ao servidor. Tente novamente.';
    erro.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
